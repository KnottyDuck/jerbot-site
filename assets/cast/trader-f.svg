<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" fill="#182d3c" rx="16"/>
  <!-- Monitor -->
  <rect x="12" y="14" width="96" height="72" rx="8" fill="#0d1721" stroke="#86baf5" stroke-width="2"/>
  <rect x="16" y="18" width="88" height="64" rx="5" fill="#182d3c"/>
  <rect x="50" y="86" width="20" height="8" rx="2" fill="#0d1721" stroke="#86baf5" stroke-width="1.5"/>
  <rect x="38" y="94" width="44" height="5" rx="2.5" fill="#0d1721" stroke="#86baf5" stroke-width="1.5"/>
  <!-- Tier badge: The Trader (f05) -->
  <rect x="8" y="8" width="32" height="10" rx="5" fill="#86baf5" opacity="0.9"/>
  <text x="24" y="15.5" font-family="'Arial', sans-serif" font-size="5" font-weight="700"
        text-anchor="middle" fill="#0d1721" letter-spacing="0.3">TRADER</text>
  <!-- Body: sharp blazer (female trader style) -->
  <path d="M 36 86 Q 34 70 34 64 Q 34 58 60 56 Q 86 58 86 64 Q 86 70 84 86 Z"
        fill="#2a3a6e" stroke="#0d1721" stroke-width="1.5"/>
  <!-- Blouse -->
  <path d="M 55 60 L 60 86 L 65 60 Q 62 58 58 60 Z" fill="#c4d4f0" stroke="#0d1721" stroke-width="0.8"/>
  <!-- Lapels -->
  <path d="M 60 60 L 50 56 L 36 64" fill="none" stroke="#0d1721" stroke-width="1.2"/>
  <path d="M 60 60 L 70 56 L 84 64" fill="none" stroke="#0d1721" stroke-width="1.2"/>
  <!-- Gold earrings (stud, tone 02 warmer) -->
  <circle cx="40" cy="53" r="2.5" fill="#d4a017" stroke="#0d1721" stroke-width="1"/>
  <circle cx="80" cy="53" r="2.5" fill="#d4a017" stroke="#0d1721" stroke-width="1"/>
  <!-- Neck -->
  <rect x="55" y="52" width="10" height="7" rx="3" fill="#c8956c" stroke="#0d1721" stroke-width="1.2"/>
  <!-- Head (tone 02: warm medium) -->
  <ellipse cx="60" cy="42" rx="18" ry="20" fill="#c8956c" stroke="#0d1721" stroke-width="1.8"/>
  <!-- Hair: sleek high bun with side part -->
  <!-- Bun base -->
  <ellipse cx="60" cy="24" rx="10" ry="8" fill="#2c1a0e" stroke="#0d1721" stroke-width="1.4"/>
  <!-- Side swept hair -->
  <path d="M 42 38 Q 44 22 60 20 Q 46 24 44 36 Z" fill="#2c1a0e" stroke="#0d1721" stroke-width="1.2"/>
  <path d="M 78 38 Q 76 24 60 20 Q 74 24 76 36 Z" fill="#2c1a0e" stroke="#0d1721" stroke-width="1.2"/>
  <!-- Eyes -->
  <ellipse cx="52" cy="42" rx="3.5" ry="3" fill="#ffffff" stroke="#0d1721" stroke-width="1"/>
  <ellipse cx="68" cy="42" rx="3.5" ry="3" fill="#ffffff" stroke="#0d1721" stroke-width="1"/>
  <circle cx="53" cy="42" r="2" fill="#1a0a00"/>
  <circle cx="69" cy="42" r="2" fill="#1a0a00"/>
  <circle cx="53.8" cy="41.2" r="0.7" fill="#ffffff"/>
  <circle cx="69.8" cy="41.2" r="0.7" fill="#ffffff"/>
  <!-- Eyebrows (arched, confident) -->
  <path d="M 48 37 Q 52 35 56 37" fill="none" stroke="#2c1a0e" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 64 37 Q 68 35 72 37" fill="none" stroke="#2c1a0e" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M 58 45 Q 57 49 60 50 Q 63 49 62 45" fill="none" stroke="#9a6040" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Neutral assured expression -->
  <path d="M 54 53 Q 60 56 66 53" fill="none" stroke="#0d1721" stroke-width="1.4" stroke-linecap="round"/>
</svg>