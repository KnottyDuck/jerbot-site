<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  
  <!-- Jayms pose B: standing upright, arms slightly raised, curious/observing lean -->
  <!-- Hair -->
  <ellipse cx="60" cy="22" rx="20" ry="14" fill="#1a0a04" stroke="#0d1721" stroke-width="1.5"/>
  <ellipse cx="43" cy="27" rx="8" ry="11" fill="#1a0a04" stroke="#0d1721" stroke-width="1.5"/>
  <ellipse cx="77" cy="27" rx="8" ry="11" fill="#1a0a04" stroke="#0d1721" stroke-width="1.5"/>
  <path d="M50 18 Q52 14 55 18" fill="none" stroke="#2d1208" stroke-width="1"/>
  <path d="M58 16 Q61 12 64 16" fill="none" stroke="#2d1208" stroke-width="1"/>
  <path d="M66 18 Q69 14 72 18" fill="none" stroke="#2d1208" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="60" cy="36" rx="16" ry="17" fill="#4a2010" stroke="#0d1721" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="53" cy="36" rx="5.5" ry="6" fill="#0d1721"/>
  <ellipse cx="67" cy="36" rx="5.5" ry="6" fill="#0d1721"/>
  <ellipse cx="53" cy="36" rx="3.5" ry="4" fill="#3a1a06"/>
  <ellipse cx="67" cy="36" rx="3.5" ry="4" fill="#3a1a06"/>
  <ellipse cx="51.5" cy="34" rx="1.5" ry="1.5" fill="white" opacity="0.9"/>
  <ellipse cx="65.5" cy="34" rx="1.5" ry="1.5" fill="white" opacity="0.9"/>
  <!-- raised brow: curious -->
  <path d="M49 29 Q53 27 57 29" fill="none" stroke="#1a0a04" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M63 29 Q67 27 71 29" fill="none" stroke="#1a0a04" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Warm smile -->
  <path d="M53 46 Q60 52 67 46" fill="none" stroke="#0d1721" stroke-width="2" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="55" y="51" width="10" height="7" rx="2" fill="#4a2010" stroke="#0d1721" stroke-width="1.5"/>
  <!-- Torso -->
  <path d="M40 58 Q44 56 55 59 L55 95 L40 95 Z" fill="#c9952a" stroke="#0d1721" stroke-width="2"/>
  <path d="M80 58 Q76 56 65 59 L65 95 L80 95 Z" fill="#c9952a" stroke="#0d1721" stroke-width="2"/>
  <rect x="43" y="59" width="34" height="36" rx="2" fill="#c9952a" stroke="#0d1721" stroke-width="2"/>
  <!-- Arms slightly raised, palms up -->
  <path d="M40 64 Q24 62 18 72" fill="none" stroke="#4a2010" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 64 Q96 62 102 72" fill="none" stroke="#4a2010" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="17" cy="74" rx="5" ry="4" fill="#4a2010" stroke="#0d1721" stroke-width="1.5"/>
  <ellipse cx="103" cy="74" rx="5" ry="4" fill="#4a2010" stroke="#0d1721" stroke-width="1.5"/>
  <!-- Legs -->
  <rect x="44" y="95" width="13" height="52" rx="4" fill="#1e2d45" stroke="#0d1721" stroke-width="2"/>
  <rect x="63" y="95" width="13" height="52" rx="4" fill="#1e2d45" stroke="#0d1721" stroke-width="2"/>
  <!-- Shoes -->
  <ellipse cx="50" cy="149" rx="8" ry="4" fill="#0d1721"/>
  <ellipse cx="70" cy="149" rx="8" ry="4" fill="#0d1721"/>
</svg>