<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024"
     role="img" aria-labelledby="title-b desc-b">
  <title id="title-b">Avoiding Jayms icon</title>
  <desc id="desc-b">Face-on jumping spider logo. Wide rounded head, bold two-tone legs with miter knee joints, four cut-out eyes, pupil-highlight dots for an alert stare. Bold, graphic, confident.</desc>

  <defs>
    <mask id="eyes-b">
      <rect width="100" height="100" fill="#fff"/>
      <!-- Principal eyes r=8 — tight, intense -->
      <circle cx="42" cy="54" r="8"  fill="#000"/>
      <circle cx="58" cy="54" r="8"  fill="#000"/>
      <!-- Secondary eyes r=3.8 -->
      <circle cx="31.5" cy="46" r="3.8" fill="#000"/>
      <circle cx="68.5" cy="46" r="3.8" fill="#000"/>
    </mask>
  </defs>

  <rect width="100" height="100" fill="#0e1116"/>

  <g mask="url(#eyes-b)">

    <!-- Abdomen: C's exact dimensions -->
    <ellipse cx="50" cy="31" rx="15" ry="13" fill="#e8eaee" stroke="none"/>

    <!-- Head: C's exact dimensions -->
    <ellipse cx="50" cy="54" rx="24" ry="19" fill="#e8eaee" stroke="none"/>

    <!-- LEGS: root points moved inward on legs 3+4 to close body gaps.
         Leg 3 roots: L (33→33 58) R (69→67 58) — nudged inside head edge.
         Leg 4 roots: L (36→37 64) R (64→63 64) — same fix.
         Stroke raised to 5.5, colour lightened to #d4d8e0 for visibility
         on dark tile while keeping two-tone contrast with body #e8eaee.
         Miter joins preserved for sharp graphic knee angles. -->
    <g fill="none" stroke="#d4d8e0" stroke-width="5.5"
       stroke-linecap="round" stroke-linejoin="miter">
      <!-- Left legs -->
      <path d="M33 45 L16 26 L9  44"/>
      <path d="M30 52 L9  45 L5  63"/>
      <path d="M33 58 L10 62 L9  80"/>
      <path d="M37 64 L20 76 L19 91"/>
      <!-- Right legs (mirror) -->
      <path d="M67 45 L84 26 L91 44"/>
      <path d="M70 52 L91 45 L95 63"/>
      <path d="M67 58 L90 62 L91 80"/>
      <path d="M63 64 L80 76 L81 91"/>
    </g>

  </g>

  <!-- PUPIL HIGHLIGHTS: outside mask, on top of eye voids.
       Inward-offset gaze (looking at viewer). r=3. -->
  <circle cx="40" cy="52" r="3" fill="#e8eaee"/>
  <circle cx="56" cy="52" r="3" fill="#e8eaee"/>

</svg>
