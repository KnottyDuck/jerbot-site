<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Rug Pulled! Live game icon</title>
  <desc id="desc">Green staircase grinds down through the lower half of the tile then fires vertically up; a small figure hangs from the upper spike by one raised arm, body entirely above the price action.</desc>

  <!-- BACKGROUND: same near-black tile as rug-pulled-icon.svg -->
  <rect width="100" height="100" fill="#0e1116"/>

  <!-- AXES -->
  <path d="M6 16v76h88" fill="none" stroke="#28303a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- GRID -->
  <path d="M7 36h85M7 56h85M7 76h85M46 17v74"
        fill="none" stroke="#1b222b" stroke-width="1"/>

  <!-- STAIRCASE PRICE DROP: stays entirely in the lower half (y≥56).
       Orthogonal steps grinding down from (8,56) to the spike base (46,88).
       Last segment closes flush with the spike at x=46.
       Weight/caps/joins identical to rug-pulled-icon.svg. -->
  <path d="M8 56 H18 V64 H26 V72 H34 V78 H42 V84 H46 V88"
        fill="none" stroke="#22c55e" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- VERTICAL SPIKE: tall — base (46,88) to peak (46,10).
       78-unit spike gives maximum height contrast with the staircase. -->
  <path d="M46 88 46 10"
        fill="none" stroke="#22c55e" stroke-width="6.5" stroke-linecap="round"/>

  <!-- RING AT PEAK -->
  <circle cx="46" cy="10" r="3.2" fill="#0e1116" stroke="#22c55e" stroke-width="2.2"/>

  <!-- STICK FIGURE: hangs from UPPER part of spike.
       Grip hand at (46,19) — on the spike, 9 units below the ring.
       Shoulder at (34,23). Head cy=15 r=4.5 — top of head at y=10.5.
       Torso (34,23)→(34,35). Left arm (34,23)→(25,31).
       Feet at y=45 — 11 units above the staircase top (y=56).
       Entire figure is above the price action. -->
  <g fill="none" stroke="#d9dde2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Right arm UP: grips spike at (46,19) -->
    <path d="M34 23 46 19" stroke-width="4"/>
    <!-- Torso -->
    <path d="M34 23 34 35" stroke-width="5.5"/>
    <!-- Left arm trailing down-left -->
    <path d="M34 23 25 31" stroke-width="4"/>
    <!-- Left leg -->
    <path d="M34 35 29 45" stroke-width="4.5"/>
    <!-- Right leg -->
    <path d="M34 35 39 45" stroke-width="4.5"/>
  </g>
  <!-- Head -->
  <circle cx="36" cy="15" r="4.5" fill="#d9dde2"/>

</svg>
