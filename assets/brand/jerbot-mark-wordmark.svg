<!-- Wordmark O. Geometry copied from favicon.svg (A's small-size variant:
     thicker arms, larger centre opening) because the flat mark's thin arms
     vanish at nav size. The app-icon background plate is removed — as a letter
     this sits on the page, not on a tile. Kept separate from favicon.svg so
     changing the favicon cannot silently change the wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">Jerbot seven-arm app mark</title>
  <desc id="desc">A cream seven-arm galactic seal with a lime eye on an ink field.</desc>

  <style>
    .blade { fill: #fbf7ec; }
    .eye-ring { fill: #c8f751; }
    .eye { fill: #0b0c0e; }
  </style>

  <!-- The same clear-eye silhouette as the flat mark, with an app-safe field. -->
  <defs>
    <path id="blade" class="blade" d="M48.1 41.7 C53.9 33.1 66.6 24.4 84.8 22.7 C76.7 31.3 67.1 38.4 56.1 47.8 C53.1 50.4 49.2 48.3 48.1 41.7 Z"/>
  </defs>

  <g>
    <use href="#blade"/>
    <use href="#blade" transform="rotate(51.4286 50 50)"/>
    <use href="#blade" transform="rotate(102.8571 50 50)"/>
    <use href="#blade" transform="rotate(154.2857 50 50)"/>
    <use href="#blade" transform="rotate(205.7143 50 50)"/>
    <use href="#blade" transform="rotate(257.1429 50 50)"/>
    <use href="#blade" transform="rotate(308.5714 50 50)"/>
  </g>

  <circle class="eye-ring" cx="50" cy="50" r="15.625"/>
  <circle class="eye" cx="50" cy="50" r="9"/>
</svg>
