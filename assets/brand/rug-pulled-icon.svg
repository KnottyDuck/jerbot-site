<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Rug Pulled! game icon</title>
  <desc id="desc">A red market line climbs then collapses vertically; a figure is thrown onto its back clear of the drop.</desc>
  <rect width="100" height="100" fill="#0e1116"/>
  <path d="M6 16v76h46" fill="none" stroke="#28303a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M7 36h45M7 56h45M7 76h45M29 17v74" fill="none" stroke="#1b222b" stroke-width="1"/>
  <path d="M8 80 15 72 21 75 27 64 33 68 39 54 44 58 49 42 52 28" fill="none" stroke="#e5484d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 28 54 84" fill="none" stroke="#e5484d" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="52" cy="28" r="3.2" fill="#0e1116" stroke="#e5484d" stroke-width="2.2"/>
  <!-- Figure: rotated 47 degrees onto its back, scaled 0.58, per Jerry
       2026-09-22. The scale is set by clearance, not taste: at 0.78 the
       kicked leg crossed the collapse line by 7.4 units. Measured result
       is a 2.8-unit gap from the line and a 4.7-unit right margin.
       Rotation is about the figure's own centre (76,47). -->
  <g transform="translate(-1 3) translate(76 47) rotate(47) scale(0.58) translate(-76 -47)">
  <g fill="none" stroke="#d9dde2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M77 37 64 51" stroke-width="7"/>
    <path d="M77 37 70 28 64 21" stroke-width="5"/>
    <path d="M77 37 86 32 92 25" stroke-width="5"/>
    <path d="M64 51 78 55 94 49" stroke-width="6"/>
    <path d="M64 51 59 62 68 74" stroke-width="6"/>
  </g>
  <!-- Head moved closer to the shoulder joint along the same angle it was
       already on, with a small deliberate gap kept rather than fully closed:
       stick figures still read as attached with some neck space, but a zero
       gap read as fused (Jerry 2026-09-23, two rounds of feedback). Was
       (83,22), about 10 units clear of the body; final position keeps a
       roughly 4-unit gap, nudged slightly toward the top of the frame. -->
  <circle cx="79.6" cy="26.7" r="6" fill="#d9dde2"/>
  </g>
</svg>
