name: Deploy

# jerbot.dev is static HTML with no build step. This workflow stages the site
# files in GitHub Actions and publishes that directory to Cloudflare Pages with
# Wrangler. The previous Netlify deployment path is no longer used here.
#
# Requires:
#   secret CLOUDFLARE_API_TOKEN    — Cloudflare API token for Pages deployment
#   variable CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (not secret)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the site itself. Deploying the repo root would ship
      # .github/ and README.md to a public web server.
      - name: Stage publish directory
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.netlify' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'README.md' \
            --exclude '.DS_Store'
          echo "Publishing $(find _site -type f | wc -l) files"

      # Fail loudly rather than deploying an empty directory over a live site.
      - name: Sanity-check the publish directory
        run: |
          test -f _site/index.html || { echo "::error::index.html missing"; exit 1; }
          test -f _site/styles.css || { echo "::error::styles.css missing"; exit 1; }

      # Wrangler publishes the staged _site directory to the existing
      # Cloudflare Pages project. There is no site build command in this job.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }
          npx -y wrangler@4 pages deploy _site \
            --project-name jerbot-site \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
